{% load static %}
{% include 'inc/header.html' %}

<div class="container my-4" style="max-width: 700px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">
                {% if huesped.id %}
                    <i class="bi bi-pencil-square text-primary me-2"></i>Editar Huésped
                {% else %}
                    <i class="bi bi-person-plus-fill text-primary me-2"></i>Registrar Nuevo Huésped
                {% endif %}
            </h3>
            <p class="text-muted small mb-0">Ingresa los datos del cliente para la base de datos de Walena Hotel</p>
        </div>
        <a href="{% url 'listar_huespedes' %}" class="btn btn-outline-secondary btn-sm fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label small fw-bold">Tipo de Documento</label>
                        <select name="tipo_documento" class="form-select" required>
                            <option value="CC" {% if huesped.tipo_documento == 'CC' %}selected{% endif %}>Cédula de Ciudadanía</option>
                            <option value="CE" {% if huesped.tipo_documento == 'CE' %}selected{% endif %}>Cédula de Extranjería</option>
                            <option value="PASAPORTE" {% if huesped.tipo_documento == 'PASAPORTE' %}selected{% endif %}>Pasaporte</option>
                            <option value="TI" {% if huesped.tipo_documento == 'TI' %}selected{% endif %}>Tarjeta de Identidad</option>
                        </select>
                    </div>

                    <div class="col-md-7">
                        <label class="form-label small fw-bold">Número de Documento</label>
                        <input type="text" name="numero_documento" class="form-control" value="{{ huesped.numero_documento|default:'' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nombres</label>
                        <input type="text" name="nombres" class="form-control" value="{{ huesped.nombres|default:'' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Apellidos</label>
                        <input type="text" name="apellidos" class="form-control" value="{{ huesped.apellidos|default:'' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Teléfono de Contacto</label>
                        <input type="text" name="telefono" class="form-control" value="{{ huesped.telefono|default:'' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control" value="{{ huesped.correo|default:'' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nacionalidad</label>
                        <input type="text" name="nacionalidad" class="form-control" value="{{ huesped.nacionalidad|default:'Colombiana' }}" required>
                    </div>

                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" name="es_extranjero" id="es_extranjero" {% if huesped.es_extranjero %}checked{% endif %}>
                            <label class="form-check-label fw-bold small text-dark" for="es_extranjero">
                                Es Extranjero (Exención de IVA DIAN)
                            </label>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                            <i class="bi bi-save me-1"></i> Guardar Huésped
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% include 'inc/footer.html' %}
