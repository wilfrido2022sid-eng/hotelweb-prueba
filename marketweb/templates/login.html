{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Walena — Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            
            <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-white p-2 rounded-circle shadow-sm d-inline-flex mb-2" style="width: 100px; height: 100px;">
                        <img src="{% static 'img/logo.png' %}" alt="Logo Hotel Walena" class="img-fluid object-fit-contain">
                    </div>
                    <h4 class="fw-bold text-dark mb-1">Hotel Walena</h4>
                    <p class="text-muted small mb-0">Sistema Operativo de Recepción</p>
                </div>

                <!-- Mensajes de Notificación -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show small py-2" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="identificador" class="form-label fw-semibold text-dark small">
                            <i class="bi bi-person-badge me-1 text-primary"></i>Nombre o Correo Electrónico
                        </label>
                        <input type="text" class="form-control form-control-lg fs-6" id="identificador" name="identificador" required autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label fw-semibold text-dark small">
                            <i class="bi bi-lock me-1 text-primary"></i>Contraseña
                        </label>
                        <input type="password" class="form-control form-control-lg fs-6" id="contrasena" name="contrasena" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="text-muted extra-small">SysHSENA v1.0 — Acceso Restringido</span>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
