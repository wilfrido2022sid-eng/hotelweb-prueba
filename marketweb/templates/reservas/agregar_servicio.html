{% load static %}
{% include 'inc/header.html' %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="fw-bold text-dark mb-0">
                        <i class="bi bi-cart-plus text-primary me-2"></i>Cargar Consumo a Reserva
                    </h4>
                    <p class="text-muted small mt-1 mb-0">
                        Huésped: <strong class="text-dark">{{ reserva.huesped.nombres }} {{ reserva.huesped.apellidos }}</strong> | Hab: <strong class="text-dark">{{ reserva.habitacion.numero }}</strong>
                    </p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="servicio_id" class="form-label fw-bold text-secondary extra-small text-uppercase">Seleccionar Servicio/Consumo</label>
                            <select name="servicio_id" id="servicio_id" class="form-select" required>
                                <option value="">-- Elija un servicio del catálogo --</option>
                                {% for servicio in servicios %}
                                    <option value="{{ servicio.id }}">{{ servicio.nombre }} - ${{ servicio.precio }} ({{ servicio.categoria }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="cantidad" class="form-label fw-bold text-secondary extra-small text-uppercase">Cantidad</label>
                            <input type="number" name="cantidad" id="cantidad" class="form-control" value="1" min="1" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary fw-bold w-50 shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Cargar a la Cuenta
                            </button>
                            <a href="{% url 'inicio' %}" class="btn btn-light border fw-bold w-50 shadow-sm text-dark">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'inc/footer.html' %}
